version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4

  backend1:
    build:
      context: .
    container_name: backend1
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always

  backend2:
    build:
      context: .
    container_name: backend2
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always

  backend3:
    build:
      context: .
    container_name: backend3
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always

  backend4:
    build:
      context: .
    container_name: backend4
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always